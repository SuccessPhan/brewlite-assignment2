name: CI

# Chạy khi mở/cập nhật pull request và khi merge vào main.
# Mỗi app đi đúng thứ tự Install → Lint → Unit Test → Build; bước nào lỗi thì dừng, PR không merge được.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U brewlite"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_URL: postgresql://brewlite:brewlite@localhost:5433/brewlite?schema=public
      DATABASE_URL: postgresql://brewlite_app:brewlite_app_ci@localhost:5433/brewlite?schema=public
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Chuẩn bị CSDL cho integration test
        run: |
          npx prisma db push --skip-generate
          npm run db:harden
      - name: Integration test (PostgreSQL thật)
        run: npm run test:int

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Kiểm kiểu TypeScript
        run: npm run typecheck
      - name: Unit test (component)
        run: npm run test
      - name: Build
        run: npm run build
