name: CI

# Chạy khi mở/cập nhật pull request; khi merge vào main thì pipeline CD (cd.yml) gọi lại file này làm cổng chất lượng.
# Mỗi app đi đúng thứ tự Install → Lint → Unit Test → Build; bước nào lỗi thì dừng, PR không merge được, không deploy.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U brewlite"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_URL: postgresql://brewlite:brewlite@localhost:5433/brewlite?schema=public
      DATABASE_URL: postgresql://brewlite_app:brewlite_app_ci@localhost:5433/brewlite?schema=public
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Kiểm tra schema.prisma khớp thư mục migration
        # Sửa schema mà quên tạo migration (npm run db:migrate:dev) thì bước này báo lỗi
        run: |
          psql "postgresql://brewlite:brewlite@localhost:5433/brewlite" -c "CREATE DATABASE brewlite_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://brewlite:brewlite@localhost:5433/brewlite_shadow" --exit-code
      - name: Áp migration, rào CSDL
        run: |
          npm run db:migrate
          npm run db:harden
      - name: Integration test (PostgreSQL thật)
        run: npm run test:int

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Kiểm kiểu TypeScript
        run: npm run typecheck
      - name: Unit test (component)
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    # Chỉ chạy khi backend và frontend đã qua lint, test, build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U brewlite"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_URL: postgresql://brewlite:brewlite@localhost:5433/brewlite?schema=public
      DATABASE_URL: postgresql://brewlite_app:brewlite_app_ci@localhost:5433/brewlite?schema=public
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            tests/e2e/package-lock.json
      - name: Backend - cài, build, áp migration, nạp dữ liệu mẫu
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          npm run db:setup
      - name: Frontend - cài, build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Cài Playwright và Chromium
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E từ menu đến màn hình xác nhận đơn
        working-directory: tests/e2e
        run: npm test
      - name: Lưu báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
